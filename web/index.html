<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparador de rotaciones</title>
<!--
  CAPA VISUAL: esta pagina es funcional y deliberadamente sobria.
  Quien la embellezca (ver GEMINI_UX.md) puede cambiar TODO el CSS y el HTML
  de las plantillas, pero no debe calcular ni redactar: solo pinta el objeto
  "vista" que devuelve /api/evaluar.
-->
<style>
:root{--fondo:#F3F5F2;--tinta:#16211B;--suave:#3D4A42;--tarjeta:#FFF;--verde:#1F5A3C;
--alta-f:#FBE4D2;--alta-t:#7A2E04;--media-f:#F4E7B8;--media-t:#5C4700;--baja-f:#DCE9F7;--baja-t:#143A68;--gris-f:#E4E7E5;--gris-t:#33383A}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px}
h1{font-size:1.7rem;margin:0}h2{font-size:1.2rem;margin:0}h3{font-size:1.05rem;margin:0}
p{margin:0}.suave{color:var(--suave);font-size:.9rem}
.tarjeta{background:var(--tarjeta);border-radius:14px;padding:16px;display:grid;gap:10px}
.rejilla{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.cabeza{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nivel{font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap}
.nivel[data-nivel=alta]{background:var(--alta-f);color:var(--alta-t)}
.nivel[data-nivel=media]{background:var(--media-f);color:var(--media-t)}
.nivel[data-nivel=baja]{background:var(--baja-f);color:var(--baja-t)}
.nivel[data-nivel=no_evaluable]{background:var(--gris-f);color:var(--gris-t)}
.nivel[data-nivel=no_depende_de_la_rotacion]{background:var(--baja-f);color:var(--baja-t)}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600}
input,select,button{font:inherit;min-height:44px;padding:8px 10px;border-radius:10px;border:2px solid var(--verde);background:#fff;color:var(--tinta)}
input[type=number]{width:7.5rem}
button{font-weight:700;cursor:pointer}
button.principal,button[aria-pressed=true]{background:var(--verde);color:#fff}
.botones{display:flex;gap:8px;flex-wrap:wrap}
.barra{height:14px;background:var(--baja-f);border-radius:7px;overflow:hidden}
.barra>div{height:100%;background:#1D4E89}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.caja{background:#EEF1ED;border-radius:10px;padding:10px 12px;font-size:.9rem}
.aviso-sintetico{background:var(--alta-f);color:var(--alta-t);font-weight:700;padding:12px 16px;border-radius:10px}
details{font-size:.85rem}summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--verde);font-weight:600}
ul{margin:0;padding-left:18px}a{color:var(--verde);word-break:break-all}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
<h1 data-t="titulo">Mi lote</h1>
<p class="suave" id="celda"></p>
</header>

<form id="formulario" class="tarjeta" style="display:flex">
<label><span data-t="lat">Latitud</span><input type="number" name="lat" step="0.01" value="42.03" required></label>
<label><span data-t="lon">Longitud</span><input type="number" name="lon" step="0.01" value="-93.63" required></label>
<label><span data-t="suelo">Tipo de suelo</span><select name="textura"></select></label>
<label><span data-t="labranza">Labranza</span><select name="labranza">
<option value="siembra_directa" data-t="sd">Siembra directa</option>
<option value="convencional" data-t="conv">Convencional (arado)</option></select></label>
<label><span data-t="idioma">Idioma</span><select name="idioma"><option value="es">Español</option><option value="en">English</option></select></label>
<button class="principal" data-t="ver">Ver mi lote</button>
</form>

<p id="estado" role="status" class="suave"></p>
<p id="sintetico" class="aviso-sintetico" hidden></p>

<section id="lote" hidden aria-labelledby="t-lote">
<div style="display:grid;gap:16px">
<h2 id="t-lote" data-t="guarda">Lo que el lote guarda para el próximo año</h2>
<div class="tarjeta" id="agua"></div>
<h2 data-t="atencion">A qué ponerle atención</h2>
<div class="rejilla" id="tarjetas"></div>
</div>
</section>

<section id="comparar" hidden aria-labelledby="t-op">
<div style="display:grid;gap:16px">
<h2 id="t-op" data-t="opciones">Opciones para el próximo año</h2>
<p class="suave" data-t="ninguna">Ninguna es perfecta. Mire qué gana y qué paga con cada una.</p>
<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:8px" data-t="importa">Lo que más me importa</legend>
<div class="botones" id="prioridad">
<button type="button" data-orden="sanidad" aria-pressed="true" data-t="sanidad">Sanidad</button>
<button type="button" data-orden="agua" aria-pressed="false" data-t="aguab">Agua</button>
<button type="button" data-orden="suelo" aria-pressed="false" data-t="suelob">Suelo</button>
</div></fieldset>
<div class="rejilla" id="opciones"></div>
<p class="suave" id="leyenda"></p>
</div>
</section>

<footer><p class="suave" id="aviso"></p></footer>
</main>

<script>
const UI = {
 es:{titulo:"Mi lote",lat:"Latitud",lon:"Longitud",suelo:"Tipo de suelo",labranza:"Labranza",sd:"Siembra directa",conv:"Convencional (arado)",idioma:"Idioma",ver:"Ver mi lote",
     guarda:"Lo que el lote guarda para el próximo año",atencion:"A qué ponerle atención",opciones:"Opciones para el próximo año",ninguna:"Ninguna es perfecta. Mire qué gana y qué paga con cada una.",
     importa:"Lo que más me importa",sanidad:"Sanidad",aguab:"Agua",suelob:"Suelo",invierno:"Dónde pasa el invierno:",anio:"Este año:",frena:"Qué lo frena:",tecnico:"Pregunte a su técnico",
     si:"Sí",no:"No",nose:"No sé",fuentes:"Ver de dónde sale esto",supuestos:"Supuestos",lagunas:"Lo que no sabemos",aguaT:"Agua en el suelo",actual:"Lo que hace hoy",bueno:"Lo bueno",costo:"El costo",
     hable:"Hable con su técnico sobre:",cargando:"Consultando datos de la NASA… la primera vez tarda.",sintetico:"DATOS DE EJEMPLO SINTÉTICOS: no se pudo consultar la NASA. Las cifras no son reales.",limites:"Límites de este cálculo"},
 en:{titulo:"My field",lat:"Latitude",lon:"Longitude",suelo:"Soil type",labranza:"Tillage",sd:"No-till",conv:"Conventional (plowed)",idioma:"Language",ver:"See my field",
     guarda:"What the field carries into next year",atencion:"What to watch",opciones:"Options for next year",ninguna:"None is perfect. See what you gain and what you pay with each.",
     importa:"What matters most to me",sanidad:"Crop health",aguab:"Water",suelob:"Soil",invierno:"Where it spends the winter:",anio:"This year:",frena:"What holds it back:",tecnico:"Ask your advisor",
     si:"Yes",no:"No",nose:"Not sure",fuentes:"See where this comes from",supuestos:"Assumptions",lagunas:"What we do not know",aguaT:"Water in the soil",actual:"What you do today",bueno:"The upside",costo:"The cost",
     hable:"Talk to your advisor about:",cargando:"Fetching NASA data… the first time is slow.",sintetico:"SYNTHETIC SAMPLE DATA: NASA could not be reached. These figures are not real.",limites:"Limits of this calculation"}};
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...hijos) => { const e=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) k==="class"?e.className=v:k==="text"?e.textContent=v:e.setAttribute(k,v);
  hijos.flat().filter(Boolean).forEach(h=>e.append(h)); return e; };
const linea = (fuerte, texto) => el("p",{}, el("strong",{text:fuerte+" "}), texto);
const nivel = n => el("span",{class:"nivel","data-nivel":n.clave,text:`${n.simbolo} ${n.etiqueta}`});
const lista = items => el("ul",{}, items.map(i=>el("li",{}, /^https?:/.test(i)?el("a",{href:i,rel:"noopener",text:i}):i)));
let vista=null, vio={}, orden="sanidad";

function traducir(id){ document.documentElement.lang=id;
  document.querySelectorAll("[data-t]").forEach(n=>n.textContent=UI[id][n.dataset.t]); }

function pintar(){ const t=UI[vista.idioma], L=vista.lote_hoy;
  $("#celda").textContent=vista.textos.celda; $("#aviso").textContent=vista.textos.aviso; $("#leyenda").textContent=vista.textos.leyenda;
  $("#sintetico").hidden=!vista.datos_sinteticos; $("#sintetico").textContent=t.sintetico;
  const a=$("#agua"); a.replaceChildren();
  if(L.agua){ const b=el("div",{class:"barra",role:"img","aria-label":L.agua.texto_estado}, el("div",{style:`width:${Math.max(0,L.agua.fraccion_llena)*100}%`}));
    a.append(el("h3",{text:`${t.aguaT} · ${L.agua.textura.nombre_mostrar}`}), b, el("p",{text:L.agua.texto_estado}), el("p",{class:"suave",text:L.agua.texto_anio}),
      el("details",{}, el("summary",{text:t.limites}), lista(L.agua.limites))); }
  $("#tarjetas").replaceChildren(...L.tarjetas.map(c=>{
    const preg = c.pregunta && el("fieldset",{style:"border:0;padding:0;margin:0"}, el("legend",{style:"font-weight:600;margin-bottom:8px",text:c.pregunta}),
      el("div",{class:"botones"}, [["si",t.si],["no",t.no],["nose",t.nose]].map(([v,txt])=>{
        const b=el("button",{type:"button","aria-pressed":String((vio[c.clave]||"nose")===v&&c.clave in vio),text:txt});
        b.onclick=()=>{vio[c.clave]=v; consultar();}; return b;})));
    return el("article",{class:"tarjeta","data-problema":c.clave,"data-nivel":c.nivel.clave},
      el("div",{class:"cabeza"}, el("h3",{text:c.nombre}), nivel(c.nivel)),
      linea(t.invierno,c.donde_pasa_el_invierno), linea(t.anio,c.este_anio), linea(t.frena,c.que_lo_frena), preg,
      el("p",{class:"caja"}, el("strong",{text:t.tecnico+" "}), c.tecnico),
      el("details",{}, el("summary",{text:t.fuentes}), lista(c.fuentes),
        c.supuestos.length?el("p",{}, el("strong",{text:t.supuestos+": "}), c.supuestos.join(", ")):null,
        el("p",{}, el("strong",{text:t.lagunas})), lista(c.lagunas))); }));
  const ops=[...vista.opciones].sort((x,y)=>x.orden[orden]-y.orden[orden]);
  $("#opciones").replaceChildren(...ops.map(o=>el("article",{class:"tarjeta","data-rotacion":o.clave},
      el("div",{class:"cabeza"}, el("h3",{text:o.nombre}), o.es_actual?el("span",{class:"nivel","data-nivel":"no_evaluable",text:t.actual}):null),
      o.lineas.map(l=>el("p",{}, l.nivel?nivel(l.nivel):null, " ", el("strong",{text:l.titulo+": "}), l.texto)),
      el("div",{class:"dos"}, el("div",{class:"caja"}, el("strong",{text:t.bueno}), el("p",{text:o.lo_bueno})),
                              el("div",{class:"caja"}, el("strong",{text:t.costo}), el("p",{text:o.el_costo}))),
      linea(t.hable,o.tecnico))));
  $("#lote").hidden=$("#comparar").hidden=false; }

async function consultar(){ const f=new FormData($("#formulario")), id=f.get("idioma"); traducir(id);
  const q=new URLSearchParams(f); const v=Object.entries(vio).filter(([,r])=>r!=="nose").map(([k,r])=>`${k}:${r}`).join(",");
  if(v) q.set("vio",v);
  $("#estado").textContent=UI[id].cargando;
  try{ const r=await fetch("/api/evaluar?"+q); if(!r.ok) throw new Error(r.status); vista=(await r.json()).vista; }
  catch(e){ vista=await (await fetch(`ejemplo_${id}.json`)).json(); }
  $("#estado").textContent=""; pintar(); }

$("#formulario").onsubmit=e=>{e.preventDefault(); vio={}; consultar();};
$("#prioridad").onclick=e=>{ const b=e.target.closest("button"); if(!b||!vista) return; orden=b.dataset.orden;
  document.querySelectorAll("#prioridad button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); pintar(); };
const TEX={arena:["Arena","Sand"],franco_arenoso:["Franco arenoso","Sandy loam"],franco:["Franco","Loam"],franco_limoso:["Franco limoso","Silt loam"],franco_arcillo_limoso:["Franco arcillo-limoso","Silty clay loam"],arcilla:["Arcilla","Clay"]};
$("select[name=textura]").append(...Object.entries(TEX).map(([k,[es]])=>el("option",{value:k,text:es,...(k==="franco_limoso"?{selected:""}:{})})));
</script>
</body>
</html>
