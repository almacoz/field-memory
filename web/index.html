<!--
  Webapp por pasos: Inicio → 1 Su lote → 2 Lo que dejó el año → 3 Elegir rotación → 4 Resumen.
  "Cómo lo sabemos" y las fuentes viven en un panel lateral (menú). Hay un modo demo guiado.
  La página no calcula conclusiones: pinta el objeto "vista" de /api/evaluar.
-->
<style>
:root {
  --bg: #F6F6F4;
  --panel: #FFFFFF;
  --tinta: #111827;
  --suave: #4B5563;
  --tenue: #6B7280;
  --borde: #E5E7EB;
  --borde-f: #D1D5DB;
  --acento: #1F5135;
  --acento-h: #173D28;
  --acento-f: #EEF4F0;
  --foco: #2563EB;
  --alta-t: #9A3412; --alta-f: #FFF7ED; --alta-b: #FDBA74;
  --media-t: #854D0E; --media-f: #FEFCE8; --media-b: #FACC15;
  --baja-t: #1E40AF; --baja-f: #EFF6FF; --baja-b: #93C5FD;
  --gris-t: #374151; --gris-f: #F3F4F6; --gris-b: #9CA3AF;
  --ext-t: #5B21B6; --ext-f: #F5F3FF; --ext-b: #C4B5FD;
  --agua: #1E3A8A; --agua-f: #E0E7FF;
  --r: 12px;
  --r-s: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tinta);
  font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: clamp(1.9rem, 1.2rem + 2.6vw, 3rem); line-height: 1.08; letter-spacing: -0.025em; font-weight: 700; }
h2 { font-size: clamp(1.4rem, 1.1rem + 1.1vw, 1.9rem); line-height: 1.18; letter-spacing: -0.015em; font-weight: 700; }
h3 { font-size: 1.05rem; line-height: 1.3; font-weight: 650; }
a { color: var(--acento); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
[hidden] { display: none !important; }
.suave { color: var(--suave); }
.tenue { color: var(--tenue); font-size: 0.875rem; }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Estructura de la app ---------- */
.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
.top { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borde); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; gap: 20px; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; color: var(--tinta); text-decoration: none; white-space: nowrap; }
.marca svg { color: var(--acento); }
.marca-logo { width: 30px; height: auto; display: block; }
.pasos { flex: 1; display: flex; justify-content: center; gap: 4px; list-style: none; margin: 0; padding: 0; }
.pasos button { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 10px; border-radius: var(--r-s); cursor: pointer; color: var(--tenue); font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
.pasos button:disabled { cursor: default; opacity: 0.55; }
.pasos .n { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--borde-f); display: grid; place-items: center; font-size: 0.75rem; font-weight: 600; }
.pasos button[aria-current="step"] { color: var(--tinta); font-weight: 600; }
.pasos button[aria-current="step"] .n { background: var(--acento); border-color: var(--acento); color: #fff; }
.pasos button.hecho .n { border-color: var(--acento); color: var(--acento); }
.pasos .sep { width: 18px; height: 1px; background: var(--borde-f); align-self: center; }
.top-acc { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-s); border: 1px solid var(--borde-f); background: var(--panel); font-weight: 600; font-size: 0.95rem; cursor: pointer; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.btn:hover { border-color: var(--tenue); }
.btn.prim { background: var(--acento); border-color: var(--acento); color: #fff; }
.btn.prim:hover { background: var(--acento-h); }
.btn.fantasma { border-color: transparent; background: none; }
.btn.fantasma:hover { background: var(--gris-f); }
.btn svg { width: 18px; height: 18px; flex: none; }
@media (max-width: 900px) {
  .pasos .txt, .pasos .sep { display: none; }
  .top-acc .demo-txt { display: none; }
}

.vista { max-width: 1180px; width: 100%; margin: 0 auto; padding: 32px 20px 120px; }
.pantalla { display: grid; gap: 24px; animation: entra 0.25s ease; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cabeza-pantalla { display: grid; gap: 8px; max-width: 760px; }

.panel { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--r); padding: 20px; }
.panel.sin-pad { padding: 0; }

/* Barra inferior de navegación */
.pie-nav { position: sticky; bottom: 0; z-index: 25; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--borde); }
.pie-in { max-width: 1180px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.pie-in .resumen-sel { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 0.92rem; color: var(--suave); overflow: hidden; }
.pie-in .resumen-sel strong { color: var(--tinta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Niveles (símbolo + palabra, tonos apagados) ---------- */
.nivel { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; border-radius: 999px; padding: 3px 10px; border: 1px solid; white-space: nowrap; line-height: 1.4; }
.nivel[data-nivel="alta"] { color: var(--alta-t); background: var(--alta-f); border-color: var(--alta-b); }
.nivel[data-nivel="media"] { color: var(--media-t); background: var(--media-f); border-color: var(--media-b); }
.nivel[data-nivel="baja"] { color: var(--baja-t); background: var(--baja-f); border-color: var(--baja-b); }
.nivel[data-nivel="no_evaluable"] { color: var(--gris-t); background: var(--gris-f); border-color: var(--gris-b); border-style: dashed; }
.nivel[data-nivel="no_depende_de_la_rotacion"] { color: var(--ext-t); background: var(--ext-f); border-color: var(--ext-b); }
.nivel[data-nivel="sin_hospedante"] { color: var(--tenue); background: var(--panel); border-color: var(--borde-f); border-style: dashed; }
.nivel.solo { padding: 3px 8px; min-width: 32px; justify-content: center; }

/* ---------- Inicio ---------- */
.inicio { display: grid; gap: 32px; align-items: center; }
@media (min-width: 960px) { .inicio { grid-template-columns: 1fr 1.05fr; min-height: calc(100vh - 64px - 200px); } }
.inicio-txt { display: grid; gap: 20px; justify-items: start; }
.inicio-txt .bajada { font-size: 1.15rem; color: var(--suave); max-width: 52ch; }
.inicio-acc { display: flex; gap: 10px; flex-wrap: wrap; }
.inicio-img { position: relative; }
.inicio-img img, .inicio-img svg { width: 100%; height: auto; display: block; }
.hero-visual-container { width: 100%; max-width: 620px; height: auto; overflow: visible; justify-self: center; }
.rot-visual { width: 100%; max-width: 560px; margin-top: 8px !important; }
.rot-visual svg { width: 100%; height: auto; display: block; }
.ini-orbita { transform-origin: 320px 265px; animation: ini-giro 60s linear infinite; }
@keyframes ini-giro { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ini-orbita { animation: none; } }
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  background: var(--tinta);
  color: #fff;
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1.3;
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;
  z-index: 35;
}
.inicio-img[data-tooltip]::after { bottom: 10px; left: auto; right: 10px; transform: none; }
[data-tooltip]:hover::after, [data-tooltip]:focus-visible::after { opacity: 1; }
.puntos { display: grid; gap: 12px; list-style: none; padding: 0; margin: 4px 0 0; }
.puntos li { display: flex; gap: 10px; align-items: baseline; color: var(--suave); }
.puntos b { color: var(--tinta); font-weight: 600; }
.puntos .n { flex: none; width: 22px; height: 22px; border-radius: 999px; background: var(--acento-f); color: var(--acento); font-size: 0.75rem; font-weight: 700; display: grid; place-items: center; transform: translateY(3px); }

/* ---------- Paso 1: formulario ---------- */
.form-lote { display: grid; gap: 20px; max-width: 760px; }
.campos { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .campos { grid-template-columns: 1fr; } }
label { display: grid; gap: 6px; font-weight: 600; font-size: 0.9rem; }
label .ayuda { font-weight: 400; color: var(--tenue); font-size: 0.82rem; }
select, input { min-height: 44px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--borde-f); background: var(--panel); width: 100%; }
select:hover, input:hover { border-color: var(--tenue); }
details.mas > summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; color: var(--acento); min-height: 40px; display: flex; align-items: center; list-style: none; }
details.mas > summary::before { content: "+"; width: 18px; font-weight: 700; }
details.mas[open] > summary::before { content: "–"; }
.enlace-suelo { justify-self: start; padding: 0 6px; margin-left: -6px; min-height: 32px; color: var(--acento); font-size: .9rem; }
.guia-suelo { display: grid; gap: 10px; }
.gs-fila { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--borde); border-radius: 10px; }
.gs-fila.sel { border-color: var(--acento); background: var(--acento-f); }
.gs-fila p { margin: 4px 0 0; font-size: .92rem; }
.mas-cuerpo { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; padding-top: 8px; align-items: start; }
@media (max-width: 640px) { .mas-cuerpo { grid-template-columns: 1fr; } }
.estado.error { color: var(--alta-t); font-weight: 600; }
.estado { font-size: 0.92rem; color: var(--suave); min-height: 1.4em; }
.cargando::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 2px solid var(--borde-f); border-top-color: var(--acento); border-radius: 999px; animation: gira 0.8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.aviso-sint { background: var(--alta-f); color: var(--alta-t); border: 1px solid var(--alta-b); border-radius: var(--r-s); padding: 10px 14px; font-weight: 600; font-size: 0.92rem; }

/* ---------- Paso 2: diagnóstico ---------- */
.diag { display: grid; gap: 20px; }
@media (min-width: 960px) { .diag { grid-template-columns: 1.55fr 1fr; align-items: start; } }
.conclusion { display: grid; gap: 14px; padding: 28px; }
.conclusion h2 { max-width: 26ch; }
.conclusion .reducen { border-top: 1px solid var(--borde); padding-top: 14px; font-weight: 600; }
.conclusion-pie { display: flex; align-items: center; gap: 14px; }
.conclusion-pie img { width: 72px; height: 72px; flex: none; }
.agua-mini { display: grid; gap: 10px; }
.barra-agua { height: 8px; border-radius: 999px; background: var(--agua-f); overflow: hidden; }
.barra-agua > div { height: 100%; background: var(--agua); border-radius: 999px; }
.agua-num { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.agua-num strong { font-size: 1.6rem; letter-spacing: -0.02em; }
.lista-problemas { display: grid; }
.fila-problema { display: grid; grid-template-columns: 44px minmax(0,1fr) 20px; gap: 12px; align-items: center; padding: 14px 20px; border: 0; border-top: 1px solid var(--borde); background: none; text-align: left; cursor: pointer; width: 100%; }
.fila-problema:first-of-type { border-top: 0; }
.fila-problema:hover { background: #FAFAF9; }
.fila-problema .nom { font-weight: 600; }
.fila-problema .lin { display: block; font-size: 0.88rem; color: var(--suave); font-weight: 400; margin-top: 2px; }
.fila-problema .flecha { color: var(--tenue); }
.cab-lista { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 16px 20px 8px; }

/* ---------- Paso 3: elegir rotación ---------- */
.elegir { display: grid; gap: 20px; }
@media (min-width: 960px) { .elegir { grid-template-columns: 400px 1fr; align-items: start; } .det-rot { position: sticky; top: 88px; } }
.orden { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.88rem; color: var(--suave); }
.chips { display: inline-flex; background: var(--gris-f); border-radius: var(--r-s); padding: 3px; gap: 2px; }
.chips button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; color: var(--suave); cursor: pointer; min-height: 34px; }
.chips button[aria-pressed="true"] { background: var(--panel); color: var(--tinta); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.orden-msg { font-size: 0.85rem; color: var(--acento); font-weight: 600; min-height: 1.3em; }
.opciones { display: grid; gap: 10px; }
.opcion { display: grid; gap: 10px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
.opcion:hover { border-color: var(--borde-f); }
.opcion[aria-checked="true"] { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
.opcion-cab { display: flex; align-items: center; gap: 10px; }
.opcion-cab .puesto { flex: none; width: 26px; height: 26px; border-radius: 999px; background: var(--gris-f); color: var(--suave); font-size: 0.78rem; font-weight: 700; display: grid; place-items: center; }
.opcion[aria-checked="true"] .puesto { background: var(--acento); color: #fff; }
.opcion-cab h3 { flex: 1; }
.radio { width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid var(--borde-f); flex: none; display: grid; place-items: center; }
.opcion[aria-checked="true"] .radio { border-color: var(--acento); }
.opcion[aria-checked="true"] .radio::after { content: ""; width: 9px; height: 9px; border-radius: 999px; background: var(--acento); }
.opcion .criterio { font-size: 0.85rem; color: var(--suave); }
.opcion .simbolos { display: flex; gap: 4px; flex-wrap: wrap; }
.opcion.movida { animation: resalta 1.2s ease; }
@keyframes resalta { 0% { background: var(--acento-f); } 100% { background: var(--panel); } }
.etq-hoy { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--suave); background: var(--gris-f); border-radius: 4px; padding: 2px 6px; }

.ciclo { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ciclo img { width: 40px; height: 40px; }
.ciclo .c { display: grid; justify-items: center; gap: 0; font-size: 0.72rem; color: var(--suave); font-weight: 500; }
.ciclo .fl { color: var(--tenue); font-size: 0.9rem; }
.ciclo.grande img { width: 76px; height: 76px; }
.ciclo.grande .c { font-size: 0.82rem; }

.det-rot { display: grid; gap: 0; }
.det-cab { padding: 20px; display: grid; gap: 14px; border-bottom: 1px solid var(--borde); }
.det-cuerpo { padding: 8px 20px 20px; display: grid; gap: 18px; }
.comp { width: 100%; border-collapse: collapse; }
.comp caption { text-align: left; padding: 4px 0 14px; caption-side: top; }
.comp-tit { display: block; font-size: 1.12rem; font-weight: 700; color: var(--tinta); margin-bottom: 8px; }
.comp-ley { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: .88rem; color: var(--suave); margin-bottom: 10px; }
.comp-ley span { padding: 3px 10px; border-radius: 8px; background: var(--gris-f, #F3F4F6); }
.comp-ley span.con { background: var(--acento-f); color: var(--acento); }
.comp-res { display: flex; gap: 8px; flex-wrap: wrap; }
.comp thead th small { display: block; font-size: .78rem; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--suave); margin-top: 2px; max-width: 9.5em; white-space: normal; line-height: 1.25; }
.comp th.col-con { color: var(--acento); }
.comp thead th.c { white-space: nowrap; }
.comp th.col-con small { color: var(--acento); font-weight: 600; }
.comp .col-con { background: var(--acento-f); }
.comp thead th.col-con { border-top-left-radius: 10px; border-top-right-radius: 10px; }
.dif-pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; border: 1px solid; white-space: nowrap; }
.dif-pill.mejora { color: var(--baja-t); background: var(--baja-f); border-color: var(--baja-b); }
.dif-pill.empeora { color: var(--alta-t); background: var(--alta-f); border-color: var(--alta-b); }
.dif-pill.igual { color: var(--tenue); background: var(--panel); border-color: var(--borde); }
.ss-estado:empty { display: none; }
.ss-res { border: 1px solid var(--borde); background: var(--panel); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.mapa-suelo { display: grid; gap: 8px; margin-top: 4px; }
.ms-cab { display: grid; gap: 8px; }
.fila-problema .txt { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.mini, .cat-foto { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--gris-f); border: 1px solid var(--borde); display: block; }
.mini.vacia, .cat-foto.vacia { background: repeating-linear-gradient(45deg, var(--gris-f) 0 6px, #fff 6px 12px); }
.cat-foto { width: 64px; height: 64px; }
.cat-lista { display: grid; gap: 8px; }
.cat-item { display: grid; grid-template-columns: 64px minmax(0,1fr) 20px; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); text-align: left; font: inherit; color: var(--tinta); cursor: pointer; }
.cat-item:hover { border-color: var(--acento); }
.cat-item > span:nth-child(2) { display: grid; gap: 2px; font-size: .9rem; }
.enlace-cat { justify-self: start; padding: 0 6px; margin-left: -6px; min-height: 36px; color: var(--acento); font-size: .92rem; }
.link-prob { border: 0; background: none; padding: 0; font: inherit; color: var(--tinta); text-decoration: underline; text-decoration-color: var(--borde-f); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.link-prob:hover { color: var(--acento); text-decoration-color: currentColor; }
.nota-sed { font-size: .85rem; color: var(--suave); background: var(--gris-f); border-radius: 10px; padding: 10px 12px; margin: 4px 0 0; }
.nota-sed .ast { color: var(--baja-t); font-weight: 700; margin-right: 4px; }
.nota-sed strong { color: var(--tinta); }
.sed-det summary { cursor: pointer; font-size: .88rem; color: var(--acento); font-weight: 600; }
.sed-det p { font-size: .85rem; margin: 6px 0 0; }
.alcance { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: -6px 0 0; font-size: .9rem; max-width: 56ch; }
.alcance .pill { background: var(--acento-f); color: var(--acento); border: 1px solid #C7DCCD; border-radius: 999px; padding: 3px 12px; font-weight: 600; }
.orig { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid; margin: 4px 6px 0 0; white-space: nowrap; }
.orig.nasa { color: #1E40AF; background: #EFF6FF; border-color: #BFDBFE; }
.orig.usda { color: #854D0E; background: #FEFCE8; border-color: #FDE68A; }
.orig.regla { color: var(--acento); background: var(--acento-f); border-color: #C7DCCD; }
.orig.vio { color: var(--gris-t); background: var(--gris-f); border-color: var(--borde-f); }
.orig.sup { color: var(--alta-t); background: var(--alta-f); border-color: var(--alta-b); }
.origenes { display: flex; flex-wrap: wrap; }
